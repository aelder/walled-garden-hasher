# Release gates run on every push:
# - `test`: comparison with the specification reference
# - `crosscheck`: comparison with the deployed sse2neon implementation
# - `stratum-test`: end-to-end share construction and submission
# - `audit-disas`: performance-sensitive instruction selection and scheduling
name: gates

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    # The AArch64 crypto intrinsics and -mcpu=native build require Apple silicon.
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # crosscheck compiles ../verus, which includes sse2neon. Without the
          # submodule the independent cross-check cannot compile.
          submodules: recursive

      - name: Toolchain
        run: |
          clang++ --version
          sysctl -n machdep.cpu.brand_string
          python3 --version

      - name: Build
        run: make all

      - name: Differential against the from-spec reference
        run: make test

      - name: Cross-check against the deployed sse2neon build
        run: make crosscheck

      - name: Share path end to end
        run: make stratum-test

      - name: Codegen audit
        # Functional tests do not enforce AESE/AESMC instruction pairing.
        run: python3 tools/audit-disas.py build/src/*.o

      - name: Front end starts and exits without a terminal
        # Without a tty, the front end must exit with its documented diagnostic.
        run: |
          set +e
          ./build/vh22-top < /dev/null > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          test $rc -eq 1 || { echo "expected exit 1 without a tty, got $rc"; exit 1; }
          grep -q "interactive terminal" out.txt

  # Package v* tags after the gates complete.
  release:
    needs: gates
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: make all

      - name: Tag must match the version the binary reports
        # Otherwise the tag and the thing users run disagree, and the first
        # person to paste --version into a bug report is the one who finds out.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          got="$(./build/vh22-top --version | awk '{print $2}')"
          echo "tag $tag, binary $got"
          test "$tag" = "$got" || {
            echo "tag v$tag does not match kVersion $got in ui/vh22top.cpp"; exit 1; }

      - name: Package
        run: |
          name="walled-garden-hasher-${GITHUB_REF_NAME}-macos-arm64"
          mkdir -p "dist/$name"
          cp build/vh22-top "dist/$name/"
          cp ui/news.md "dist/$name/"
          cp INSTALL.md "dist/$name/"
          cp README.md CHANGELOG.md LICENSE "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="walled-garden-hasher-${GITHUB_REF_NAME}-macos-arm64"
          gh release create "$GITHUB_REF_NAME" \
            --title "The Walled Garden Hasher $GITHUB_REF_NAME" \
            --notes-file INSTALL.md \
            "dist/$name.tar.gz" \
            "dist/$name.tar.gz.sha256"
